<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A few beats</title>
<style>
  :root {
    --bg:#0a0a0a;
    --text:#f2f2f2;
    --muted:#8d8d8d;
    --line:#2b2b2b;
  }

  * { box-sizing:border-box; }

  body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  main {
    width:min(760px, calc(100% - 40px));
    margin:72px auto 90px;
  }

  h1 {
    font-size:34px;
    font-weight:500;
    letter-spacing:-0.02em;
    margin:0 0 10px;
  }

  .contact {
    margin:0 0 38px;
    font-size:12px;
    color:var(--muted);
  }

  .contact a {
    color:inherit;
    text-decoration:none;
  }

  .contact a:hover {
    text-decoration:underline;
    text-underline-offset:3px;
  }

  .controls {
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    align-items:center;
    margin:0 0 26px;
  }

  button {
    appearance:none;
    border:0;
    background:none;
    padding:0;
    color:var(--text);
    font:inherit;
    cursor:pointer;
  }

  .controls button {
    font-size:13px;
    text-decoration:underline;
    text-underline-offset:3px;
  }

  .now-playing {
    margin:0 0 8px;
    font-size:12px;
    color:var(--muted);
  }

  .now-playing strong {
    color:var(--text);
    font-weight:500;
  }

  .queue-player {
    width:100%;
    height:32px;
    margin:0 0 26px;
    filter:invert(1) hue-rotate(180deg);
    opacity:.9;
  }

  .track {
    border-top:1px solid var(--line);
    padding:18px 0 16px;
  }

  .track:last-child {
    border-bottom:1px solid var(--line);
  }

  .track-head {
    display:flex;
    align-items:baseline;
    gap:12px;
    margin-bottom:10px;
  }

  .num {
    width:24px;
    flex:none;
    font-size:12px;
    color:var(--muted);
  }

  .label {
    font-size:18px;
    line-height:1.2;
  }

  .track.playing .label {
    font-weight:600;
  }

  audio {
    width:100%;
    height:32px;
    filter:invert(1) hue-rotate(180deg);
    opacity:.9;
  }

  details {
    margin-top:46px;
    border-top:1px solid var(--line);
    padding-top:18px;
  }

  summary {
    list-style:none;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
  }

  summary::-webkit-details-marker {
    display:none;
  }

  .more-label {
    font-size:13px;
  }

  .more-count {
    color:var(--muted);
    font-size:12px;
  }

  .archive-inner {
    padding-top:22px;
  }

  .archive .track {
    padding:12px 0 10px;
  }

  .archive .label {
    font-size:15px;
  }

  footer {
    margin-top:56px;
    font-size:12px;
    color:var(--muted);
  }

  footer a {
    color:inherit;
    text-decoration:none;
  }

  footer a:hover {
    text-decoration:underline;
    text-underline-offset:3px;
  }
</style>
</head>
<body>
<main>
  <h1>A few beats</h1>
  <div class="contact">
    <a href="mailto:stefan.reppen@gmail.com">stefan.reppen@gmail.com</a>
  </div>

  <section>
    <div class="controls">
      <button id="playScope">Play featured</button>
      <button id="shuffleScope">Shuffle featured</button>
      <button id="nextTrack">Next</button>
    </div>
    <div id="nowPlaying" class="now-playing" hidden>Now playing: <strong id="nowPlayingTitle"></strong></div>
    <audio id="queuePlayer" class="queue-player" controls preload="metadata" hidden></audio>
    <div id="featured"></div>
  </section>

  <details id="archiveDetails">
    <summary>
      <span class="more-label">More beats</span>
      <span id="archiveCount" class="more-count"></span>
    </summary>
    <div class="archive-inner">
      <div id="archive" class="archive"></div>
    </div>
  </details>

</main>

<script src="tracks.js"></script>
<script>
(() => {
  const tracks = (window.BEATS || []).map((t,i) => ({...t, index:i}));
  const featured = tracks.filter(t => t.featured);
  const archive = tracks.filter(t => !t.featured);

  const featuredEl = document.getElementById('featured');
  const archiveEl = document.getElementById('archive');
  const details = document.getElementById('archiveDetails');
  const archiveCount = document.getElementById('archiveCount');
  const playScope = document.getElementById('playScope');
  const shuffleScope = document.getElementById('shuffleScope');
  const nextTrack = document.getElementById('nextTrack');
  const queuePlayer = document.getElementById('queuePlayer');
  const nowPlaying = document.getElementById('nowPlaying');
  const nowPlayingTitle = document.getElementById('nowPlayingTitle');

  archiveCount.textContent = `${archive.length} more`;

  const audioByIndex = new Map();
  const rowByIndex = new Map();

  let playlist = [];
  let currentPlaylistPos = -1;
  let playlistActive = false;
  let lastPlayedIndex = null;
  let queueCurrentIndex = null;

  function audioUrl(t) {
    return 'audio/' + encodeURIComponent(t.file).replace(/%2F/g,'/');
  }

  function setPlayingRow(index = null) {
    for (const [idx, row] of rowByIndex) {
      row.classList.toggle('playing', idx === index);
    }
  }

  function pauseManualPlayers(resetPosition = false) {
    for (const audio of audioByIndex.values()) {
      audio.pause();
      if (resetPosition) audio.currentTime = 0;
    }
  }

  function cancelQueue(hidePlayer = true) {
    playlistActive = false;
    currentPlaylistPos = -1;
    queueCurrentIndex = null;
    queuePlayer.pause();

    if (hidePlayer) {
      queuePlayer.hidden = true;
      nowPlaying.hidden = true;
      nowPlayingTitle.textContent = '';
      queuePlayer.removeAttribute('src');
      queuePlayer.load();
    }
  }

  function makeRow(t, visibleNumber) {
    const row = document.createElement('div');
    row.className = 'track';
    row.dataset.index = t.index;

    const head = document.createElement('div');
    head.className = 'track-head';

    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = String(visibleNumber).padStart(2,'0');

    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = t.label;

    const audio = document.createElement('audio');
    audio.controls = true;
    audio.preload = 'metadata';
    audio.src = audioUrl(t);

    head.append(num,label);
    row.append(head,audio);

    audioByIndex.set(t.index, audio);
    rowByIndex.set(t.index, row);

    audio.addEventListener('play', () => {
      // Directly playing a track cancels any Play/Shuffle queue.
      cancelQueue(true);

      for (const [idx, other] of audioByIndex) {
        if (other !== audio && !other.paused) other.pause();
      }

      lastPlayedIndex = t.index;
      setPlayingRow(t.index);
    });

    audio.addEventListener('ended', () => {
      row.classList.remove('playing');
    });

    return row;
  }

  featured.forEach((t,i) => featuredEl.appendChild(makeRow(t,i+1)));
  archive.forEach((t,i) => archiveEl.appendChild(makeRow(t, featured.length+i+1)));

  function scopeTracks() {
    return details.open ? tracks : featured;
  }

  function updateScopeLabels() {
    if (details.open) {
      playScope.textContent = 'Play all';
      shuffleScope.textContent = 'Shuffle all';
    } else {
      playScope.textContent = 'Play featured';
      shuffleScope.textContent = 'Shuffle featured';
    }
  }

  function finishPlaylist() {
    playlistActive = false;
    currentPlaylistPos = -1;
    queueCurrentIndex = null;
    setPlayingRow(null);
    queuePlayer.hidden = true;
    nowPlaying.hidden = true;
    nowPlayingTitle.textContent = '';
    queuePlayer.removeAttribute('src');
    queuePlayer.load();
  }

  function playCurrentQueueTrack() {
    if (
      !playlistActive ||
      currentPlaylistPos < 0 ||
      currentPlaylistPos >= playlist.length
    ) {
      finishPlaylist();
      return;
    }

    const idx = playlist[currentPlaylistPos];
    const t = tracks[idx];
    if (!t) {
      playNextInPlaylist();
      return;
    }

    pauseManualPlayers(false);

    queueCurrentIndex = idx;
    lastPlayedIndex = idx;
    setPlayingRow(idx);

    nowPlayingTitle.textContent = t.label;
    nowPlaying.hidden = false;
    queuePlayer.hidden = false;
    queuePlayer.src = audioUrl(t);
    queuePlayer.load();

    const promise = queuePlayer.play();
    if (promise && typeof promise.catch === 'function') {
      promise.catch(err => {
        console.warn('Queue playback could not start:', err);
      });
    }
  }

  function startPlaylist(order) {
    pauseManualPlayers(false);
    queuePlayer.pause();

    playlist = order.map(t => t.index);
    currentPlaylistPos = 0;
    playlistActive = playlist.length > 0;

    if (playlistActive) playCurrentQueueTrack();
  }

  function playNextInPlaylist() {
    if (!playlistActive) return;

    currentPlaylistPos += 1;

    if (currentPlaylistPos >= playlist.length) {
      finishPlaylist();
      return;
    }

    playCurrentQueueTrack();
  }

  function playNextGenerally() {
    if (playlistActive) {
      playNextInPlaylist();
      return;
    }

    const scope = scopeTracks();
    if (!scope.length) return;

    let nextPos = 0;

    if (lastPlayedIndex !== null) {
      const currentPos = scope.findIndex(t => t.index === lastPlayedIndex);
      if (currentPos !== -1) {
        nextPos = (currentPos + 1) % scope.length;
      }
    }

    const next = scope[nextPos];

    cancelQueue(true);
    pauseManualPlayers(true);

    lastPlayedIndex = next.index;
    const audio = audioByIndex.get(next.index);
    if (!audio) return;

    audio.currentTime = 0;
    const promise = audio.play();
    if (promise && typeof promise.catch === 'function') {
      promise.catch(err => console.warn('Playback could not start:', err));
    }
  }

  playScope.addEventListener('click', () => {
    // With More beats open, this is the complete top-to-bottom order
    // beginning with beat #1.
    startPlaylist(scopeTracks());
  });

  shuffleScope.addEventListener('click', () => {
    const arr = [...scopeTracks()];

    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }

    startPlaylist(arr);
  });

  nextTrack.addEventListener('click', playNextGenerally);

  queuePlayer.addEventListener('ended', () => {
    if (playlistActive) playNextInPlaylist();
  });

  details.addEventListener('toggle', updateScopeLabels);
  updateScopeLabels();
})();
</script>
</body>
</html>

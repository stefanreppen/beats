<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A few beats</title>
<style>
  :root {
    --bg:#fff;
    --text:#151515;
    --muted:#707070;
    --line:#dedede;
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width:min(760px, calc(100% - 40px));
    margin:72px auto 90px;
  }
  h1 {
    font-size:34px;
    font-weight:500;
    letter-spacing:-0.02em;
    margin:0 0 46px;
  }
  .section-title {
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.14em;
    margin:0 0 16px;
  }
  .controls {
    display:flex;
    gap:18px;
    align-items:center;
    margin:0 0 24px;
  }
  button {
    appearance:none;
    border:0;
    background:none;
    padding:0;
    color:var(--text);
    font:inherit;
    cursor:pointer;
  }
  .controls button {
    font-size:13px;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .track {
    border-top:1px solid var(--line);
    padding:18px 0 16px;
  }
  .track:last-child { border-bottom:1px solid var(--line); }
  .track-head {
    display:flex;
    align-items:baseline;
    gap:12px;
    margin-bottom:10px;
  }
  .num {
    width:24px;
    flex:none;
    font-size:12px;
    color:var(--muted);
  }
  .label {
    font-size:18px;
    line-height:1.2;
  }
  .track.playing .label { font-weight:600; }
  audio { width:100%; height:32px; }
  details {
    margin-top:46px;
    border-top:1px solid var(--line);
    padding-top:18px;
  }
  summary {
    list-style:none;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
  }
  summary::-webkit-details-marker { display:none; }
  .archive-inner { padding-top:22px; }
  .archive .track { padding:12px 0 10px; }
  .archive .label { font-size:15px; }
  footer {
    margin-top:56px;
    font-size:12px;
    color:var(--muted);
  }
  footer a { color:inherit; }
</style>
</head>
<body>
<main>
  <h1>A few beats</h1>

  <section>
    <div class="section-title">Featured</div>
    <div class="controls">
      <button id="playScope">Play featured</button>
      <button id="shuffleScope">Shuffle featured</button>
    </div>
    <div id="featured"></div>
  </section>

  <details id="archiveDetails">
    <summary>
      <span>Archive</span>
      <span id="archiveCount"></span>
    </summary>
    <div class="archive-inner">
      <div id="archive" class="archive"></div>
    </div>
  </details>

  <footer>
    <a href="mailto:your@email.com">your@email.com</a>
  </footer>
</main>

<script src="tracks.js"></script>
<script>
(() => {
  const tracks = (window.BEATS || []).map((t,i) => ({...t, index:i}));
  const featured = tracks.filter(t => t.featured);
  const archive = tracks.filter(t => !t.featured);

  const featuredEl = document.getElementById('featured');
  const archiveEl = document.getElementById('archive');
  const details = document.getElementById('archiveDetails');
  const archiveCount = document.getElementById('archiveCount');
  const playScope = document.getElementById('playScope');
  const shuffleScope = document.getElementById('shuffleScope');

  archiveCount.textContent = `${archive.length} more`;

  const audioByIndex = new Map();
  const rowByIndex = new Map();

  function makeRow(t, visibleNumber) {
    const row = document.createElement('div');
    row.className = 'track';
    row.dataset.index = t.index;

    const head = document.createElement('div');
    head.className = 'track-head';

    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = String(visibleNumber).padStart(2,'0');

    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = t.label;

    const audio = document.createElement('audio');
    audio.controls = true;
    audio.preload = 'metadata';
    audio.src = 'audio/' + encodeURIComponent(t.file).replace(/%2F/g,'/');

    head.append(num,label);
    row.append(head,audio);

    audioByIndex.set(t.index, audio);
    rowByIndex.set(t.index, row);

    audio.addEventListener('play', () => {
      for (const [idx, a] of audioByIndex) {
        if (a !== audio && !a.paused) a.pause();
        rowByIndex.get(idx)?.classList.toggle('playing', a === audio);
      }
      if (!playlistActive) return;
      currentPlaylistPos = playlist.indexOf(t.index);
    });

    audio.addEventListener('ended', () => {
      row.classList.remove('playing');
      if (playlistActive) playNext();
    });

    return row;
  }

  featured.forEach((t,i) => featuredEl.appendChild(makeRow(t,i+1)));
  archive.forEach((t,i) => archiveEl.appendChild(makeRow(t, featured.length+i+1)));

  let playlist = [];
  let currentPlaylistPos = -1;
  let playlistActive = false;

  function stopEverything() {
    for (const a of audioByIndex.values()) {
      a.pause();
      a.currentTime = 0;
    }
    for (const r of rowByIndex.values()) r.classList.remove('playing');
  }

  function scopeTracks() {
    return details.open ? tracks : featured;
  }

  function updateScopeLabels() {
    if (details.open) {
      playScope.textContent = 'Play all';
      shuffleScope.textContent = 'Shuffle all';
    } else {
      playScope.textContent = 'Play featured';
      shuffleScope.textContent = 'Shuffle featured';
    }
  }

  function startPlaylist(order) {
    stopEverything();
    playlist = order.map(t => t.index);
    currentPlaylistPos = 0;
    playlistActive = true;
    playCurrent();
  }

  function playCurrent() {
    if (currentPlaylistPos < 0 || currentPlaylistPos >= playlist.length) {
      playlistActive = false;
      return;
    }
    const idx = playlist[currentPlaylistPos];
    const audio = audioByIndex.get(idx);
    if (!audio) return;
    audio.currentTime = 0;
    audio.play();
  }

  function playNext() {
    currentPlaylistPos++;
    if (currentPlaylistPos >= playlist.length) {
      playlistActive = false;
      currentPlaylistPos = -1;
      return;
    }
    playCurrent();
  }

  playScope.addEventListener('click', () => {
    const scope = scopeTracks();
    // When Archive is open, tracks is the full top-to-bottom order:
    // featured beat #1 first, then the rest.
    startPlaylist(scope);
  });

  shuffleScope.addEventListener('click', () => {
    const arr = [...scopeTracks()];
    for (let i=arr.length-1;i>0;i--) {
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    startPlaylist(arr);
  });

  details.addEventListener('toggle', updateScopeLabels);
  updateScopeLabels();

  // If visitor manually seeks/plays a different audio while an auto-playlist
  // is active, it remains the active sequence from that track onward.
})();
</script>
</body>
</html>

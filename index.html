<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A few beats</title>
<style>
  :root {
    --bg:#0a0a0a;
    --text:#f2f2f2;
    --muted:#8d8d8d;
    --line:#2b2b2b;
  }

  * { box-sizing:border-box; }

  body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  main {
    width:min(760px, calc(100% - 40px));
    margin:72px auto 90px;
  }

  h1 {
    font-size:34px;
    font-weight:500;
    letter-spacing:-0.02em;
    margin:0 0 42px;
  }

  .controls {
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    align-items:center;
    margin:0 0 26px;
  }

  button {
    appearance:none;
    border:0;
    background:none;
    padding:0;
    color:var(--text);
    font:inherit;
    cursor:pointer;
  }

  .controls button {
    font-size:13px;
    text-decoration:underline;
    text-underline-offset:3px;
  }

  .track {
    border-top:1px solid var(--line);
    padding:18px 0 16px;
  }

  .track:last-child {
    border-bottom:1px solid var(--line);
  }

  .track-head {
    display:flex;
    align-items:baseline;
    gap:12px;
    margin-bottom:10px;
  }

  .num {
    width:24px;
    flex:none;
    font-size:12px;
    color:var(--muted);
  }

  .label {
    font-size:18px;
    line-height:1.2;
  }

  .track.playing .label {
    font-weight:600;
  }

  audio {
    width:100%;
    height:32px;
    filter:invert(1) hue-rotate(180deg);
    opacity:.9;
  }

  details {
    margin-top:46px;
    border-top:1px solid var(--line);
    padding-top:18px;
  }

  summary {
    list-style:none;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
  }

  summary::-webkit-details-marker {
    display:none;
  }

  .more-label {
    font-size:13px;
  }

  .more-count {
    color:var(--muted);
    font-size:12px;
  }

  .archive-inner {
    padding-top:22px;
  }

  .archive .track {
    padding:12px 0 10px;
  }

  .archive .label {
    font-size:15px;
  }

  footer {
    margin-top:56px;
    font-size:12px;
    color:var(--muted);
  }

  footer a {
    color:inherit;
    text-decoration:none;
  }

  footer a:hover {
    text-decoration:underline;
    text-underline-offset:3px;
  }
</style>
</head>
<body>
<main>
  <h1>A few beats</h1>

  <section>
    <div class="controls">
      <button id="playScope">Play featured</button>
      <button id="shuffleScope">Shuffle featured</button>
      <button id="nextTrack">Next</button>
    </div>
    <div id="featured"></div>
  </section>

  <details id="archiveDetails">
    <summary>
      <span class="more-label">More beats</span>
      <span id="archiveCount" class="more-count"></span>
    </summary>
    <div class="archive-inner">
      <div id="archive" class="archive"></div>
    </div>
  </details>

  <footer>
    <a href="mailto:stefan.reppen@gmail.com">stefan.reppen@gmail.com</a>
  </footer>
</main>

<script src="tracks.js"></script>
<script>
(() => {
  const tracks = (window.BEATS || []).map((t,i) => ({...t, index:i}));
  const featured = tracks.filter(t => t.featured);
  const archive = tracks.filter(t => !t.featured);

  const featuredEl = document.getElementById('featured');
  const archiveEl = document.getElementById('archive');
  const details = document.getElementById('archiveDetails');
  const archiveCount = document.getElementById('archiveCount');
  const playScope = document.getElementById('playScope');
  const shuffleScope = document.getElementById('shuffleScope');
  const nextTrack = document.getElementById('nextTrack');

  archiveCount.textContent = `${archive.length} more`;

  const audioByIndex = new Map();
  const rowByIndex = new Map();

  let playlist = [];
  let currentPlaylistPos = -1;
  let playlistActive = false;
  let lastPlayedIndex = null;

  function makeRow(t, visibleNumber) {
    const row = document.createElement('div');
    row.className = 'track';
    row.dataset.index = t.index;

    const head = document.createElement('div');
    head.className = 'track-head';

    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = String(visibleNumber).padStart(2,'0');

    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = t.label;

    const audio = document.createElement('audio');
    audio.controls = true;
    audio.preload = 'metadata';
    audio.src = 'audio/' + encodeURIComponent(t.file).replace(/%2F/g,'/');

    head.append(num,label);
    row.append(head,audio);

    audioByIndex.set(t.index, audio);
    rowByIndex.set(t.index, row);

    audio.addEventListener('play', () => {
      lastPlayedIndex = t.index;

      for (const [idx, a] of audioByIndex) {
        if (a !== audio && !a.paused) a.pause();
        rowByIndex.get(idx)?.classList.toggle('playing', a === audio);
      }

      if (playlistActive) {
        const position = playlist.indexOf(t.index);
        if (position !== -1) currentPlaylistPos = position;
      }
    });

    audio.addEventListener('ended', () => {
      row.classList.remove('playing');

      if (playlistActive) {
        playNextInPlaylist();
      }
    });

    return row;
  }

  featured.forEach((t,i) => featuredEl.appendChild(makeRow(t,i+1)));
  archive.forEach((t,i) => archiveEl.appendChild(makeRow(t, featured.length+i+1)));

  function stopEverything(resetPosition = true) {
    for (const a of audioByIndex.values()) {
      a.pause();
      if (resetPosition) a.currentTime = 0;
    }
    for (const r of rowByIndex.values()) r.classList.remove('playing');
  }

  function scopeTracks() {
    return details.open ? tracks : featured;
  }

  function updateScopeLabels() {
    if (details.open) {
      playScope.textContent = 'Play all';
      shuffleScope.textContent = 'Shuffle all';
    } else {
      playScope.textContent = 'Play featured';
      shuffleScope.textContent = 'Shuffle featured';
    }
  }

  function startPlaylist(order) {
    stopEverything();
    playlist = order.map(t => t.index);
    currentPlaylistPos = 0;
    playlistActive = true;
    playCurrentPlaylistTrack();
  }

  function playCurrentPlaylistTrack() {
    if (
      currentPlaylistPos < 0 ||
      currentPlaylistPos >= playlist.length
    ) {
      playlistActive = false;
      currentPlaylistPos = -1;
      return;
    }

    const idx = playlist[currentPlaylistPos];
    const audio = audioByIndex.get(idx);
    if (!audio) return;

    audio.currentTime = 0;
    audio.play();
  }

  function playNextInPlaylist() {
    currentPlaylistPos++;

    if (currentPlaylistPos >= playlist.length) {
      playlistActive = false;
      currentPlaylistPos = -1;
      return;
    }

    playCurrentPlaylistTrack();
  }

  function playNextGenerally() {
    if (playlistActive && playlist.length) {
      playNextInPlaylist();
      return;
    }

    const scope = scopeTracks();
    if (!scope.length) return;

    let nextPos = 0;

    if (lastPlayedIndex !== null) {
      const currentPos = scope.findIndex(t => t.index === lastPlayedIndex);
      if (currentPos !== -1) {
        nextPos = currentPos + 1;
        if (nextPos >= scope.length) nextPos = 0;
      }
    }

    const next = scope[nextPos];
    stopEverything();
    playlistActive = false;
    lastPlayedIndex = next.index;

    const audio = audioByIndex.get(next.index);
    if (!audio) return;

    audio.currentTime = 0;
    audio.play();
  }

  playScope.addEventListener('click', () => {
    // When More beats is open, scopeTracks() is the complete top-to-bottom
    // order, beginning with beat #1 at the top of the page.
    startPlaylist(scopeTracks());
  });

  shuffleScope.addEventListener('click', () => {
    const arr = [...scopeTracks()];

    for (let i=arr.length-1; i>0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }

    startPlaylist(arr);
  });

  nextTrack.addEventListener('click', playNextGenerally);

  details.addEventListener('toggle', updateScopeLabels);
  updateScopeLabels();
})();
</script>
</body>
</html>

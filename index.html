<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>A few beats</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0c0d;
      --panel: #151517;
      --line: #2a2a2e;
      --text: #f1f1f2;
      --muted: #98989f;
      --accent: #f1f1f2;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(720px, calc(100% - 40px));
      margin: 0 auto;
      padding: 72px 0 56px;
    }

    header { margin-bottom: 42px; }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(34px, 7vw, 54px);
      line-height: 1;
      letter-spacing: -0.045em;
      font-weight: 650;
    }

    .subhead {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .track-list {
      border-top: 1px solid var(--line);
    }

    .track {
      padding: 24px 0 25px;
      border-bottom: 1px solid var(--line);
    }

    .track-head {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin-bottom: 13px;
    }

    .number {
      width: 24px;
      flex: 0 0 24px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 580;
      letter-spacing: -0.015em;
    }

    audio {
      display: block;
      width: 100%;
      height: 38px;
    }

    footer {
      padding-top: 35px;
      color: var(--muted);
      font-size: 13px;
    }

    footer a {
      color: var(--text);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    @media (max-width: 520px) {
      main { width: min(100% - 28px, 720px); padding-top: 45px; }
      header { margin-bottom: 30px; }
      .track { padding: 20px 0 22px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>A few beats</h1>
      <p class="subhead">Four tracks.</p>
    </header>

    <section class="track-list" aria-label="Beats">
      <article class="track">
        <div class="track-head">
          <span class="number">01</span>
          <h2 class="title">So Wrong</h2>
        </div>
        <audio controls preload="metadata" src="audio/01-so-wrong.mp3"></audio>
      </article>

      <article class="track">
        <div class="track-head">
          <span class="number">02</span>
          <h2 class="title">Track 06</h2>
        </div>
        <audio controls preload="metadata" src="audio/02-track06.mp3"></audio>
      </article>

      <article class="track">
        <div class="track-head">
          <span class="number">03</span>
          <h2 class="title">Track 04</h2>
        </div>
        <audio controls preload="metadata" src="audio/03-track04.mp3"></audio>
      </article>

      <article class="track">
        <div class="track-head">
          <span class="number">04</span>
          <h2 class="title">Beat 31</h2>
        </div>
        <audio controls preload="metadata" src="audio/04-beat31.mp3"></audio>
      </article>
    </section>

    <footer>
      <!-- Replace this with the email address you want labels to use. -->
      <span>Contact: </span><a href="mailto:your@email.com">your@email.com</a>
    </footer>
  </main>

  <script>
    // Keep playback simple: starting one track pauses the others.
    const players = [...document.querySelectorAll('audio')];
    players.forEach(player => {
      player.addEventListener('play', () => {
        players.forEach(other => {
          if (other !== player) other.pause();
        });
      });
    });
  </script>
</body>
</html>
